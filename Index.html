<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Esports Tournaments</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: #0f0f1a; color: #fff; min-height: 100vh; }
    header {
      background: linear-gradient(135deg, #6d28d9, #db2777);
      padding: 20px; text-align: center; position: sticky; top: 0; z-index: 10;
    }
    header h1 { font-size: 22px; }
    header p { font-size: 12px; opacity: 0.9; margin-top: 4px; }
    main { padding: 16px; max-width: 500px; margin: 0 auto; padding-bottom: 80px; }
    .card {
      background: #1a1a2e; border-radius: 12px; padding: 16px;
      margin-bottom: 12px; border: 1px solid #2a2a3e;
    }
    .card h3 { font-size: 16px; margin-bottom: 8px; }
    .card .meta { font-size: 12px; color: #a0a0b0; margin-bottom: 4px; }
    .badge {
      display: inline-block; padding: 3px 8px; border-radius: 6px;
      font-size: 11px; font-weight: 600;
    }
    .badge.open { background: #16a34a22; color: #4ade80; }
    .badge.full { background: #dc262622; color: #f87171; }
    .btn {
      background: linear-gradient(135deg, #7c3aed, #db2777); color: #fff;
      border: none; padding: 10px 16px; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer; width: 100%;
      margin-top: 10px;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-sm { width: auto; padding: 6px 12px; font-size: 12px; margin-top: 6px; }
    input, select {
      width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 10px;
      background: #0f0f1a; border: 1px solid #2a2a3e; border-radius: 8px;
      color: #fff; font-size: 14px;
    }
    .modal-bg {
      position: fixed; inset: 0; background: #000a; display: none;
      align-items: center; justify-content: center; z-index: 100; padding: 16px;
    }
    .modal-bg.active { display: flex; }
    .modal { background: #1a1a2e; border-radius: 12px; padding: 20px; width: 100%; max-width: 400px; }
    .modal h3 { margin-bottom: 12px; }
    .tabs {
      display: flex; gap: 8px; margin-bottom: 16px;
    }
    .tabs button {
      flex: 1; background: #1a1a2e; color: #a0a0b0; border: 1px solid #2a2a3e;
      padding: 10px; border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    .tabs button.active { background: #7c3aed; color: #fff; border-color: #7c3aed; }
    .empty { text-align: center; color: #666; padding: 40px 20px; font-size: 13px; }
    .player-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid #2a2a3e; font-size: 13px;
    }
    .player-row:last-child { border-bottom: none; }
    .rank { font-weight: 700; color: #fbbf24; width: 30px; }
    .note {
      background: #1e3a5f; border-left: 3px solid #3b82f6;
      padding: 10px; border-radius: 6px; font-size: 12px; margin-bottom: 12px;
      color: #93c5fd; line-height: 1.5;
    }
    footer {
      position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a2e;
      border-top: 1px solid #2a2a3e; padding: 10px; text-align: center;
      font-size: 11px; color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎮 Free Esports Tournaments</h1>
    <p>Free Entry • Coin Prizes • Skill Based</p>
  </header>

  <main>
    <div class="note">
      ⚠️ <strong>Legal Note:</strong> Ye app <strong>free entry</strong> hai.
      Koi entry fee nahi, koi cash withdrawal nahi. Prizes sirf app coins/gift cards.
    </div>

    <div class="tabs">
      <button id="tab-tour" class="active">Tournaments</button>
      <button id="tab-board">Leaderboard</button>
      <button id="tab-me">My Profile</button>
    </div>

    <section id="view-tour"></section>
    <section id="view-board" hidden></section>
    <section id="view-me" hidden></section>
  </main>

  <!-- Join Modal -->
  <div class="modal-bg" id="joinModal">
    <div class="modal">
      <h3>Join Tournament</h3>
      <p id="joinTourName" style="font-size:12px;color:#a0a0b0;margin-bottom:12px;"></p>
      <input id="inpName" placeholder="Your Name" />
      <input id="inpUid" placeholder="Game UID (Free Fire MAX / BGMI)" />
      <input id="inpPhone" placeholder="Phone (for room ID)" maxlength="10" />
      <button class="btn" onclick="submitJoin()">Free Join</button>
      <button class="btn" style="background:#333;margin-top:6px;" onclick="closeJoin()">Cancel</button>
    </div>
  </div>

  <footer>Made for legal esports • No gambling • 18+ recommended</footer>

<script>
// ====== STORAGE HELPERS ======
const DB = {
  get: (k, d) => JSON.parse(localStorage.getItem(k) || JSON.stringify(d)),
  set: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
};

// ====== SEED DEMO DATA (first run only) ======
function seed() {
  if (DB.get('es_seeded', false)) return;
  DB.set('es_tournaments', [
    { id: 't1', name: 'Solo Showdown #1', game: 'Free Fire MAX', date: '2026-11-15', time: '8:00 PM', maxPlayers: 48, prize: '500 coins', status: 'open' },
    { id: 't2', name: 'Squad Clash #3', game: 'BGMI', date: '2026-11-16', time: '9:00 PM', maxPlayers: 100, prize: '1000 coins', status: 'open' },
  ]);
  DB.set('es_players', []);
  DB.set('es_registrations', []);
  DB.set('es_seeded', true);
}
seed();

// ====== RENDER TOURNAMENTS ======
function renderTournaments() {
  const tours = DB.get('es_tournaments', []);
  const regs = DB.get('es_registrations', []);
  const el = document.getElementById('view-tour');
  if (!tours.length) {
    el.innerHTML = '<div class="empty">Abhi koi tournament nahi hai. Admin add karega.</div>';
    return;
  }
  el.innerHTML = tours.map(t => {
    const count = regs.filter(r => r.tournamentId === t.id).length;
    const full = count >= t.maxPlayers;
    return `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:start;">
          <h3>${t.name}</h3>
          <span class="badge ${full ? 'full' : 'open'}">${full ? 'FULL' : 'OPEN'}</span>
        </div>
        <div class="meta">🎮 ${t.game}</div>
        <div class="meta">📅 ${t.date} • ${t.time}</div>
        <div class="meta">👥 ${count}/${t.maxPlayers} joined</div>
        <div class="meta">🏆 Prize: ${t.prize}</div>
        <button class="btn" ${full ? 'disabled' : ''} onclick="openJoin('${t.id}', '${t.name.replace(/'/g,'')}')">
          ${full ? 'Full' : 'Free Join'}
        </button>
      </div>
    `;
  }).join('');
}

// ====== JOIN FLOW ======
let currentTourId = null;
function openJoin(id, name) {
  currentTourId = id;
  document.getElementById('joinTourName').textContent = name;
  document.getElementById('joinModal').classList.add('active');
}
function closeJoin() {
  document.getElementById('joinModal').classList.remove('active');
  document.getElementById('inpName').value = '';
  document.getElementById('inpUid').value = '';
  document.getElementById('inpPhone').value = '';
}
function submitJoin() {
  const name = document.getElementById('inpName').value.trim();
  const uid = document.getElementById('inpUid').value.trim();
  const phone = document.getElementById('inpPhone').value.trim();
  if (!name || !uid || phone.length !== 10) {
    alert('Saari fields bharo. Phone 10 digit hona chahiye.');
    return;
  }
  const players = DB.get('es_players', []);
  const regs = DB.get('es_registrations', []);
  let player = players.find(p => p.uid === uid);
  if (!player) {
    player = { id: 'p' + Date.now(), name, uid, phone, coins: 0, kills: 0, matches: 0 };
    players.push(player);
  }
  if (regs.find(r => r.tournamentId === currentTourId && r.playerId === player.id)) {
    alert('Aap already joined ho is tournament mein.');
    return;
  }
  regs.push({ tournamentId: currentTourId, playerId: player.id, joinedAt: Date.now() });
  DB.set('es_players', players);
  DB.set('es_registrations', regs);
  alert('✅ Joined! Room ID/Password match se pehle mil jayega.');
  closeJoin();
  renderTournaments();
}

// ====== LEADERBOARD ======
function renderLeaderboard() {
  const players = DB.get('es_players', []).slice().sort((a,b) => b.kills - a.kills);
  const el = document.getElementById('view-board');
  if (!players.length) { el.innerHTML = '<div class="empty">Abhi koi player nahi.</div>'; return; }
  el.innerHTML = '<div class="card">' + players.map((p,i) => `
    <div class="player-row">
      <span class="rank">#${i+1}</span>
      <span style="flex:1;margin-left:10px;">${p.name}</span>
      <span style="color:#fbbf24;font-weight:600;">${p.kills} kills</span>
    </div>
  `).join('') + '</div>';
}

// ====== MY PROFILE ======
function renderMe() {
  const el = document.getElementById('view-me');
  const players = DB.get('es_players', []);
  el.innerHTML = `
    <div class="card">
      <h3>My Profile</h3>
      <p class="meta" style="margin-top:8px;">Total players registered: ${players.length}</p>
      <p class="meta">Top earner: ${players.length ? players.sort((a,b)=>b.coins-a.coins)[0].name : '—'}</p>
      <p class="meta">Ye demo hai — real login Apps Script version mein hoga.</p>
    </div>
  `;
}

// ====== TABS ======
document.getElementById('tab-tour').onclick = () => switchTab('tour');
document.getElementById('tab-board').onclick = () => switchTab('board');
document.getElementById('tab-me').onclick = () => switchTab('me');
function switchTab(tab) {
  ['tour','board','me'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
    document.getElementById('view-' + t).hidden = (t !== tab);
  });
  if (tab === 'tour') renderTournaments();
  if (tab === 'board') renderLeaderboard();
  if (tab === 'me') renderMe();
}

// ====== INIT ======
renderTournaments();
</script>
</body>
</html>
