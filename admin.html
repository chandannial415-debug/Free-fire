<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Panel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
  body { background: #0f0f1a; color: #fff; padding: 16px; max-width: 600px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 16px; }
  h2 { font-size: 15px; margin: 20px 0 10px; color: #a78bfa; }
  input, button { width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #2a2a3e; background: #1a1a2e; color: #fff; font-size: 14px; min-height: 44px; }
  button { background: #7c3aed; font-weight: 600; cursor: pointer; border: none; }
  button:active { background: #6d28d9; }
  .card { background: #1a1a2e; padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; }
  .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #2a2a3e; align-items: center; gap: 8px; }
  .row:last-child { border-bottom: none; }
  .small-btn { width: auto; padding: 4px 10px; font-size: 12px; background: #dc2626; margin: 0; min-height: 32px; }
  .small-btn.green { background: #16a34a; }
  .small-btn.wa { background: #25d366; margin-top: 6px; }
  .muted { color: #666; font-size: 13px; }
</style>
</head>
<body>
<h1>🛠️ Admin Panel</h1>

<h2>➕ Add Tournament</h2>
<input id="tName" placeholder="Tournament name" />
<input id="tGame" placeholder="Game (Free Fire MAX / BGMI)" />
<input id="tDate" type="date" />
<input id="tTime" placeholder="Time (e.g. 8:00 PM)" />
<input id="tMax" type="number" placeholder="Max players" min="1" />
<input id="tPrize" placeholder="Prize (e.g. 500 coins)" />
<button onclick="addTournament()">Add Tournament</button>

<h2>📋 Tournaments</h2>
<div id="tourList"><p class="muted">Loading...</p></div>

<h2>👥 Players</h2>
<div id="playerList"><p class="muted">Loading...</p></div>

<button style="background:#333;margin-top:20px;" onclick="exportData()">📤 Export JSON</button>
<button style="background:#333;" onclick="if(confirm('Saara data reset ho jayega?')){localStorage.clear();location.reload();}">🗑️ Reset All Data</button>

<script>
const DB = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
};

function addTournament() {
  const name = document.getElementById('tName').value.trim();
  const game = document.getElementById('tGame').value.trim();
  const date = document.getElementById('tDate').value;
  const time = document.getElementById('tTime').value.trim();
  const max = +document.getElementById('tMax').value;
  const prize = document.getElementById('tPrize').value.trim();
  if (!name || !game || !date || !time || !max || !prize) {
    alert('Sab fields bharo');
    return;
  }
  const tours = DB.get('es_tournaments', []);
  tours.push({ id: 't' + Date.now(), name, game, date, time, maxPlayers: max, prize, status: 'open' });
  DB.set('es_tournaments', tours);
  alert('✅ Added!');
  ['tName','tGame','tDate','tTime','tMax','tPrize'].forEach(id => document.getElementById(id).value = '');
  render();
}

function deleteTournament(id) {
  if (!confirm('Delete this tournament?')) return;
  DB.set('es_tournaments', DB.get('es_tournaments', []).filter(t => t.id !== id));
  DB.set('es_registrations', DB.get('es_registrations', []).filter(r => r.tournamentId !== id));
  render();
}

function updateKills(playerId, name) {
  const kills = prompt(name + ' — kitne kills add karein?');
  if (!kills || isNaN(kills) || +kills <= 0) return;
  const players = DB.get('es_players', []);
  const idx = players.findIndex(p => p.id === playerId);
  if (idx === -1) return;
  players[idx].kills += +kills;
  players[idx].coins += +kills * 7;
  players[idx].matches += 1;
  DB.set('es_players', players);
  alert(`✅ ${name}: +${kills} kills, total coins: ${players[idx].coins}`);
  render();
}

function whatsappShare(tour) {
  const msg = `🎮 *${tour.name}*\nGame: ${tour.game}\nDate: ${tour.date} ${tour.time}\nPrize: ${tour.prize}\nFree Entry!\n\nJoin: ${location.origin}/index.html`;
  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
}

function render() {
  const tours = DB.get('es_tournaments', []);
  const regs = DB.get('es_registrations', []);
  const players = DB.get('es_players', []);

  const tl = document.getElementById('tourList');
  tl.innerHTML = tours.length ? tours.map(t => {
    const count = regs.filter(r => r.tournamentId === t.id).length;
    return `<div class="card">
      <div class="row"><strong>${t.name}</strong>
        <button class="small-btn" onclick="deleteTournament('${t.id}')">X</button></div>
      <div class="row"><span>${t.game}</span><span>${count}/${t.maxPlayers}</span></div>
      <div class="row"><span>${t.date} ${t.time}</span><span>${t.prize}</span></div>
      <button class="small-btn wa" onclick='whatsappShare(${JSON.stringify(t)})'>Share on WhatsApp</button>
    </div>`;
  }).join('') : '<p class="muted">No tournaments.</p>';

  const pl = document.getElementById('playerList');
  pl.innerHTML = players.length ? players.map(p => `
    <div class="card">
      <div class="row"><strong>${p.name}</strong><span>UID: ${p.uid}</span></div>
      <div class="row"><span>📱 ${p.phone}</span><span>Kills: ${p.kills} | Coins: ${p.coins}</span></div>
      <button class="small-btn green" onclick="updateKills('${p.id}','${p.name.replace(/'/g,'')}')">+ Add Kills</button>
    </div>
  `).join('') : '<p class="muted">No players yet.</p>';
}

function exportData() {
  const data = {
    tournaments: DB.get('es_tournaments', []),
    players: DB.get('es_players', []),
    registrations: DB.get('es_registrations', []),
    exportedAt: new Date().toISOString(),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'esports-data-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}

render();
</script>
</body>
</html>
